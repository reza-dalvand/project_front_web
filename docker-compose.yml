# ═══════════════════════════════════════════════════════════
#   Development Environment (با اتصال به Production API)
#   استفاده: docker-compose up -d
# ═══════════════════════════════════════════════════════════

version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder # فقط تا stage بیلد
      args:
        NEXT_PUBLIC_USE_MOCK: 'false'
        NEXT_PUBLIC_API_BASE_URL: 'https://api.beauclub.ir/api/v1'
        NEXT_PUBLIC_SITE_DOMAIN: 'https://app.beauclub.ir'
        NEXT_PUBLIC_MEDIA_BASE_URL: 'https://api.beauclub.ir'
        NEXT_PUBLIC_ARVAN_CDN_URL: 'https://cdn.beauclub.ir'
        NODE_ENV: 'production'
    container_name: beau-frontend-dev
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_USE_MOCK=false
      - NEXT_PUBLIC_API_BASE_URL=https://api.beauclub.ir/api/v1
      - NEXT_PUBLIC_SITE_DOMAIN=https://app.beauclub.ir
      - NEXT_PUBLIC_MEDIA_BASE_URL=https://api.beauclub.ir
      - NEXT_PUBLIC_ARVAN_CDN_URL=https://cdn.beauclub.ir
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev:host
    restart: unless-stopped