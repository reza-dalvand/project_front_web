# ═══════════════════════════════════════════════════════════
#   Development Environment
#   استفاده: docker-compose up -d
# ═══════════════════════════════════════════════════════════

version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # فقط تا stage بیلد
      args:
        NEXT_PUBLIC_USE_MOCK: "true"
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
        NODE_ENV: "development"
    container_name: zibano-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_USE_MOCK=true
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev:host
    restart: unless-stopped