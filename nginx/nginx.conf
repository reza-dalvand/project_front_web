# ═══════════════════════════════════════════════════════════
#   Nginx Configuration for Zibano Frontend (Static Export)
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;  # همه دامنه‌ها (بعداً با certbot تنظیم می‌شود)
    
    root /usr/share/nginx/html;
    index index.html;
    
    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;
    
    # ─── Security Headers ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    
    # ─── Static Assets Cache (Next.js _next/static) ───
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ─── Images & Fonts Cache ───
    location ~* \.(ico|gif|jpe?g|png|svg|webp|avif|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
    
    # ─── Service Worker (no cache!) ───
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # ─── Manifest (short cache) ───
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
    }
    
    # ═══ Reverse Proxy به Backend Django ═══
    # فعلاً localhost چون بک‌اند روی همین سرور می‌آید
    # بعداً به container_name یا IP بک‌اند تغییر دهید
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
    
    # ─── Media files from Django ───
    location /media/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # ─── Certbot ACME Challenge ───
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # ═══ SPA Routing (Next.js Static Export) ═══
    # چون output: 'export' استفاده می‌شود، هر مسیر باید
    # به فایل .html مربوطه یا index.html برگردد
    
    # مسیرهای دقیق (مثلاً /about → /about.html)
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }
    
    # فایل‌های Next.js static chunks
    location ~* ^/_next/ {
        try_files $uri =404;
    }
    
    # ─── 404 Fallback ───
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    
    # ─── Deny hidden files ───
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}