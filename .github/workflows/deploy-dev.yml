# ═══════════════════════════════════════════════════════════
#   Deploy Pipeline - Staging (روی push به develop و staging)
# ═══════════════════════════════════════════════════════════

name: Deploy to develop

on:
  push:
    branches:
      - develop 
      - staging
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'yarn.lock'
      - 'next.config.js'
      - '.github/workflows/deploy-dev.yml'

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
  BACKUP_COUNT: 3

jobs:
  # ─── Job 1: Test & Build ───
  test-and-build:
    name: 🧪 Test & 🏗️ Build
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.version.outputs.version }}
      build-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test:ci
        env:
          CI: true
          NODE_ENV: test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-deploy-dev-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            nextjs-deploy-dev-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}-

      - name: Build static export
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SITE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SITE_DOMAIN || 'https://front-dev.beauclub.ir' }}
          NEXT_PUBLIC_ARVAN_CDN_URL: ${{ secrets.NEXT_PUBLIC_ARVAN_CDN_URL }}
          NEXT_PUBLIC_MEDIA_BASE_URL: ${{ secrets.NEXT_PUBLIC_MEDIA_BASE_URL }}
          NEXT_PUBLIC_USE_MOCK: 'false'
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "❌ Build failed: 'out' directory not found"
            exit 1
          fi
          echo "✅ Build successful"

      - name: Generate version info
        id: version
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}-${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Generate build hash
        id: hash
        run: |
          HASH=$(find out -type f -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT

      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp -r out/. deploy-package/
          echo "${{ steps.version.outputs.version }}" > deploy-package/VERSION
          tar -czf deployment.tar.gz -C deploy-package .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-dev-${{ github.run_id }}
          path: deployment.tar.gz
          retention-days: 7

  # ─── Job 2: Deploy ───
  deploy:
    name: 🚀 Deploy to develop
    runs-on: ubuntu-latest
    needs: test-and-build
    environment:
      name: develop
      url: https://front-dev.beauclub.ir
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package-dev-${{ github.run_id }}

      - name: Upload tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: 'deployment.tar.gz'
          target: '/tmp/'
          overwrite: true
          timeout: 300s
          command_timeout: 10m

      - name: Activate new release with backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            TARBALL="/tmp/deployment.tar.gz"

            mkdir -p "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            if [ -d "out" ]; then
              cp -r out "out_backup_${TIMESTAMP}"
              ls -dt out_backup_* 2>/dev/null | tail -n +$((${{ env.BACKUP_COUNT }} + 1)) | xargs -r rm -rf
            fi

            rm -rf out_new out_old 2>/dev/null || true
            mkdir -p out_new
            tar -xzf "${TARBALL}" -C out_new
            rm -f "${TARBALL}"

            mv out out_old 2>/dev/null || true
            mv out_new out
            chmod -R 755 out

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            if command -v nginx &> /dev/null; then
              sudo nginx -t
              sudo systemctl reload nginx
            fi

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            SITE_URL="${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://front-dev.beauclub.ir' }}"
            for i in $(seq 1 5); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}" --max-time 10 || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then exit 0; fi
              sleep 5
            done
            exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"
            LATEST_BACKUP=$(ls -dt out_backup_* 2>/dev/null | head -n 1)
            if [ -n "$LATEST_BACKUP" ]; then
              rm -rf out 2>/dev/null || true
              cp -r "${LATEST_BACKUP}" out
              chmod -R 755 out
              sudo systemctl reload nginx 2>/dev/null || true
            fi