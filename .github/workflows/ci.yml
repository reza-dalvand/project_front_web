# ═══════════════════════════════════════════════════════════
#   CI Pipeline - اجرا روی هر Pull Request
#   شامل: lint + test + build
# ═══════════════════════════════════════════════════════════

name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.js'
      - '.github/workflows/ci.yml'

# همزمان فقط یک ران برای هر PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Lint ───
  lint:
    name: 🔍 ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─── Job 2: Tests ───
  test:
    name: 🧪 Jest Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── Job 3: Build ───
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK: 'false'
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:8000/api/v1'
          NODE_ENV: 'production'

      - name: Verify output directory
        run: |
          if [ ! -d "out" ]; then
            echo "❌ Build failed: 'out' directory not found"
            exit 1
          fi
          echo "✅ Build successful"
          ls -la out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: out/
          retention-days: 3

  # ─── Job 4: Docker Build Test ───
  docker-test:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: beau-frontend:test
          build-args: |
            NEXT_PUBLIC_USE_MOCK=false
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
            NODE_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
