name: CI/CD Pipeline (Test, Build, Deploy Static)

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test:ci

      - name: Build Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.beauclub.ir/api/v1
          NEXT_PUBLIC_SITE_DOMAIN: https://beauclub.ir
          NEXT_PUBLIC_ARVAN_CDN_URL: https://cdn.beauclub.ir
          NEXT_PUBLIC_MEDIA_BASE_URL: https://api.beauclub.ir
          NEXT_PUBLIC_USE_MOCK: false

      - name: Upload 'out' folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out/

  deploy:
    name: Deploy to Server (Zero Downtime)
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Download 'out' artifact
        uses: actions/download-artifact@v4
        with:
          name: static-out
          path: out/

      - name: Copy files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "out/"
          target: "/home/deploy/beau-front/out_new"
          strip_components: 1
          overwrite: true

      - name: Swap folders and Reload Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Zero Downtime Swap
            rm -rf /home/deploy/beau-front/out_old
            if [ -d "/home/deploy/beau-front/out" ]; then
              mv /home/deploy/beau-front/out /home/deploy/beau-front/out_old
            fi
            mv /home/deploy/beau-front/out_new /home/deploy/beau-front/out
            
            # Fix permissions just in case
            chmod -R 755 /home/deploy/beau-front/out
            
            # Reload Nginx
            sudo systemctl reload nginx
            echo "✅ Deployment successful!"