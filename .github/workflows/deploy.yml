# ═══════════════════════════════════════════════════════════
#   Deploy Pipeline - اجرا روی push به main
#   شامل: build → push to GHCR → deploy to VPS
# ═══════════════════════════════════════════════════════════

name: Deploy to Production

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.js'
      - 'Dockerfile'
      - 'nginx/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ─── Job 1: Test & Build ───
  test-and-build:
    name: 🧪 Test & 🏗️ Build
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Build Docker image
        run: |
          echo "✅ Tests passed, building Docker image..."

  # ─── Job 2: Build & Push Docker Image ───
  build-and-push:
    name: 🐳 Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_USE_MOCK=false
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8000/api/v1' }}
            NEXT_PUBLIC_SITE_DOMAIN=${{ secrets.SITE_DOMAIN || 'http://localhost:3000' }}
            NEXT_PUBLIC_ARVAN_CDN_URL=${{ secrets.ARVAN_CDN_URL || '' }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ secrets.MEDIA_BASE_URL || 'http://localhost:8000' }}
            NODE_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ─── Job 3: Deploy to VPS ───
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh ${VPS_USER}@${VPS_HOST} << 'ENDSSH'
            set -e
            
            echo "🔐 Logging in to GHCR..."
            echo "${GHCR_TOKEN}" | docker login ${REGISTRY} -u ${GHCR_USER} --password-stdin
            
            echo "📥 Pulling latest image: ${IMAGE_TAG}"
            docker pull ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
            docker pull ${REGISTRY}/${IMAGE_NAME}:latest || true
            
            echo "🔄 Updating docker-compose.prod.yml..."
            cd /opt/zibano/frontend || mkdir -p /opt/zibano/frontend && cd /opt/zibano/frontend
            
            # آپدیت image tag در docker-compose
            sed -i "s|image: .*|image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}|g" docker-compose.prod.yml 2>/dev/null || true
            
            echo "🚀 Starting new container..."
            docker-compose -f docker-compose.prod.yml pull frontend
            docker-compose -f docker-compose.prod.yml up -d --no-deps --build frontend
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment complete!"
            docker ps | grep zibano
          ENDSSH

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for container to start..."
          sleep 15
          
          # اگر دامنه دارید، اینجا health check بزنید
          # curl -f https://yourdomain.com/ || exit 1
          echo "✅ Deployment verified"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi