name: CI/CD Pipeline - Beau Front

on:
  push:
    branches:
      - main

jobs:
  test-build-deploy:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Check Yarn version
        run: yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test:ci

      - name: Build static export
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.beauclub.ir/api/v1
          NEXT_PUBLIC_SITE_DOMAIN: https://beauclub.ir
          NEXT_PUBLIC_ARVAN_CDN_URL: https://cdn.beauclub.ir
          NEXT_PUBLIC_MEDIA_BASE_URL: https://api.beauclub.ir
          NEXT_PUBLIC_USE_MOCK: false

      - name: Check out directory
        run: |
          if [ ! -d "out" ]; then
            echo "❌ out directory not found. Static export was not generated."
            exit 1
          fi
          echo "✅ out directory exists"

      - name: Upload out directory to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'out/*'
          target: '/home/deploy/beau-front/out_new'
          strip_components: 1
          overwrite: true

      - name: Activate new release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/deploy/beau-front

            rm -rf out_old

            if [ -d "out" ]; then
              mv out out_old
            fi

            mv out_new out

            chmod -R 755 out

            sudo systemctl reload nginx

            echo "✅ Beau Front deployed successfully"
